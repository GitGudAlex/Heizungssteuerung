services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    # ports:
    #   - 3000:3000
    env_file: ./backend/.env.docker
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    # ports:
    #   - 4321:4321
    env_file: ./frontend/.env.docker
    depends_on:
      - backend

  mongo:
    image: mongo:4.4.6
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:0.54.0
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: true
      # credentials to login into mongo-express
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: smarthome
    depends_on:
      - mongo

  nginx:
    image: nginx:1.27.0
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data: